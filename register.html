<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=., initial-scale=1.0">
    <title>TechLearn LMS</title>
    <link  rel="stylesheet" href="./css/register.css">
    <link rel="stylesheet" href="./reponsive/loginForm.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script defer src="./JS/register.js"></script>
    <script defer src="./JS/language.js"></script>
    <script defer type="module" src="./JS/homepage.js"></script> 
    </head>
<body>
    <div class="login-container">
        <div class="header">
            <!-- logo part -->
            <<div class="logo-container">
                <img id="logo" src="" alt="Brand Logo">
            </div>
            <!-- language part apend here -->
        </div>
        <div class="form-container">
            <div class="name" style="display: flex; flex-direction: column; gap: 0.6rem;">
                <div class="lebal">
                    <label for="name" data-translate data-key="name">Name</label>
                    <span style="color: red; margin-left: 0.3rem;">*</span>
                </div>
                <input type="text" name="name" id="name" required>
            </div>
            <div class="last-name" style="display: flex; flex-direction: column; gap: 0.6rem;">
                <div class="lebal">
                    <label for="last-name" data-translate data-key="last-name">Last Name</label>
                    <span style="color: red; margin-left: 0.3rem;">*</span>
                </div>
                <input type="text" name="last-name" id="last-name" required>
            </div>
            <div class="profession" style="display: flex; flex-direction: column; gap: 0.6rem;">
                <div class="label">
                    <label for="profession" data-translate data-key="profession">profession</label>
                    <span style="color: red; margin-left: 0.3rem;">*</span>
                </div>
                <input type="text" name="profession" id="profession"/>
            </div>
            <div class="country" style="display: flex; flex-direction: column; gap: 0.6rem;">
                <div class="label">
                    <label for="country" data-translate data-key="country">Country</label>
                    <span style="color: red; margin-left: 0.3rem;">*</span>
                </div>
                <input type="text" name="country" id="country"/>
            </div>
            <div class="email" style="display: flex; flex-direction: column; gap: 0.6rem;">
                <div class="lebel">
                    <label for="email" data-translate data-key="email">Email</label>
                    <span style="color: red; margin-left: 0.3rem;">*</span>
                </div>
                <input type="email" name="email" id="email"/>
            </div>
            <div class="pass" style="display: flex; flex-direction: column; gap: 0.6rem;">
                <div class="lebal">
                    <label for="password" data-translate data-key="password">Password</label>
                    <span style="color: red; margin-left: 0.3rem;">*</span>
                </div>
                <input type="password" name="password" id="password" required>
            </div>
            <div class="pass-c" style="display: flex; flex-direction: column; gap: 0.6rem;">
                <div class="label">
                    <label for="confirm-password" data-translate data-key="confirm-password">Confirm Password</label>
                    <span style="color: red; margin-left: 0.3rem;">*</span>
                </div>
                <input type="password" name="confirm-password" id="confirm-password" required>
            </div>
            <button class="btn" id="btn" type="submit" data-translate data-key="sign-up">Sign Up</button>
        </div>
    </div>
</body>
</html>
